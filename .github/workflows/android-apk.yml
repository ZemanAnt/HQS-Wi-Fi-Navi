name: Android debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build HQS Wi-Fi Navi debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore packaged Android source on first run
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, lzma, tarfile
          parts = sorted(Path("bootstrap").glob("android-*.b64"))
          if len(parts) != 6:
              raise SystemExit(f"Expected 6 source parts, got {len(parts)}")
          packed = base64.b64decode("".join(p.read_text().strip() for p in parts), validate=True)
          digest = hashlib.sha256(packed).hexdigest()
          expected = "4f8bd200df9d786305f2dbe47f348f4fcc0e4b54957d7cb895d2ebb2c85b158c"
          if digest != expected:
              raise SystemExit(f"Source bundle SHA-256 mismatch: {digest}")
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode="r:") as tar:
              tar.extractall(".", filter="data")
          if not Path("app/build.gradle.kts").is_file():
              raise SystemExit("Android source extraction did not create app/build.gradle.kts")
          print("Android source extracted and integrity checked.")
          PY
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Publish unpacked project sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat tests nastroje .gitignore .gitattributes SESTAVIT_APK_WINDOWS.bat
          if ! git diff --cached --quiet; then
            git commit -m 'Unpack Kotlin Android app sources and Gradle wrapper'
            git push origin HEAD:main
          fi

      - name: Build Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HQS-Wifi-Navi-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
